<!DOCTYPE html>
<html lang="kk"><head><meta charset="UTF-8"><title>Тіркелу</title></head>
<body>
<h2>Тіркелу формасы</h2>
<!-- method="post" -> "get" етіп өзгертіп, адрес жолын салыстырыңыз -->
<form action="register" method="post">
 Аты: <input type="text" name="name"><br>
 Email: <input type="text" name="email"><br>
 Қала: <input type="text" name="city"><br>
 Телефон: <input type="text" name="phone"><br>
 Туған жылы: <input type="text" name="birthYear"><br>
 Топ: <input type="text" name="group"><br>
 <button type="submit">Тіркелу</button>
</form>
</body></html>
